/* ============ modais ============ */
let MODAL = null;
function openModal({title, body, submitLabel="Salvar", onSubmit, del, wide, extraFoot=""}){
  MODAL = {onSubmit, del};
  document.getElementById("modal-root").innerHTML = `<div class="scrim" data-act="scrim"><div class="modal ${wide?"wide":""}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <form id="mform" novalidate>
      <div class="modal-h"><h3>${esc(title)}</h3><div class="spacer"></div><button type="button" class="icon-btn" data-act="close" aria-label="Fechar">${ico("x")}</button></div>
      <div class="modal-b">${body}<div id="m-err" class="banner bad" hidden></div></div>
      <div class="modal-f">${del?`<button type="button" class="btn danger" data-act="m-del">Excluir</button>`:""}${extraFoot}<div class="spacer"></div><button type="button" class="btn" data-act="close">Cancelar</button>${onSubmit?`<button type="submit" class="btn primary">${esc(submitLabel)}</button>`:""}</div>
    </form></div></div>`;
  const f = document.querySelector("#mform input:not([type=hidden]),#mform select");
  if (f && window.matchMedia("(min-width:821px)").matches) f.focus();
}
function closeModal(){ MODAL = null; document.getElementById("modal-root").innerHTML = ""; }
function mErr(msg){ const e = document.getElementById("m-err"); if (e){ e.textContent = msg; e.hidden = false; } }
const fd = () => Object.fromEntries(new FormData(document.getElementById("mform")).entries());

const accSelect = (name, sel, label, opts={}) => `<div class="field"><label for="m-${name}">${label}</label><select id="m-${name}" name="${name}">${opts.blank?`<option value="">${opts.blank}</option>`:""}${CFG.accounts.map(a=>`<option value="${a.id}" ${a.id===sel?"selected":""}>${esc(a.name)} · ${fmt(balance(a))}</option>`).join("")}</select></div>`;
const cardSelect = (name, sel) => `<div class="field"><label for="m-${name}">Cartão</label><select id="m-${name}" name="${name}">${CFG.cards.map(c=>`<option value="${c.id}" ${c.id===sel?"selected":""}>${esc(c.name)} · ${fmt(Math.max(0,c.limit-cardUsed(c)))} livre</option>`).join("")}</select></div>`;
function catSelect(kind, sel){
  const cats = CFG.categories.filter(c=>c.kind===kind);
  return `<div class="field"><label for="m-cat-${kind}">Categoria</label><select id="m-cat-${kind}" name="cat_${kind}"><option value="">Sem categoria</option>${cats.map(c=>`<optgroup label="${esc(c.name)}"><option value="${c.id}|" ${sel===c.id+"|"?"selected":""}>${esc(c.name)}</option>${c.subs.map(s=>`<option value="${c.id}|${s.id}" ${sel===c.id+"|"+s.id?"selected":""}>${esc(c.name)} › ${esc(s.name)}</option>`).join("")}</optgroup>`).join("")}</select></div>`;
}

const TX_TYPES = {despesa:"Despesa", receita:"Receita", credito:"Cartão", transfer:"Transferência", fatura:"Pagar fatura"};
function txModal(t, preset={}){
  const isNew = !t;
  t = t ? clone(t) : {type:preset.type||"despesa", date:todayStr(), amount:0, desc:"", accountId:preset.accountId||CFG.income.accountId||CFG.accounts[0]?.id, cardId:preset.cardId||CFG.cards[0]?.id, installments:1, toAccountId:preset.toAccountId, catId:"", subId:""};
  if (preset.from) t.accountId = preset.from;
  if (t.type==="ajuste"){ return adjustModal(accById(t.accountId), t); }
  if (!CFG.accounts.length){ openModal({title:"Cadastre uma conta primeiro", body:`<p style="margin:0">Para lançar movimentações, cadastre pelo menos uma conta.</p>`, extraFoot:`<button type="button" class="btn primary" data-act="new-acc">Adicionar conta</button>`}); return; }
  const catSel = t.catId ? t.catId+"|"+(t.subId||"") : "";
  const show = types => `data-types="${types}" ${types.split(",").includes(t.type)?"":"hidden"}`;
  const toDefault = t.toAccountId || CFG.accounts.find(a=>a.id!==t.accountId)?.id;
  const invKey = t.invoiceKey || UI.month;
  const body = `
    <input type="hidden" name="type" value="${t.type}">
    <div class="seg" role="group" aria-label="Tipo de lançamento">${Object.entries(TX_TYPES).map(([k,l])=>`<button type="button" data-act="tx-type" data-t="${k}" aria-pressed="${t.type===k}" ${!isNew&&k!==t.type?"disabled":""}>${l}</button>`).join("")}</div>
    <div class="frow">
      <div class="field"><label for="m-amount">Valor${t.type==="credito"?" total":""}</label><input id="m-amount" name="amount" inputmode="decimal" placeholder="0,00" value="${t.amount?fmtIn(t.amount):""}" data-live="1"></div>
      <div class="field"><label for="m-date">Data</label><input id="m-date" name="date" type="date" value="${t.date}" data-live="1"></div>
    </div>
    <div class="field" ${show("despesa,receita,credito,transfer")}><label for="m-desc">Descrição</label><input id="m-desc" name="desc" value="${esc(t.desc)}" placeholder="Ex.: mercado, cinema, salário"></div>
    <div ${show("despesa,receita")}>${accSelect("accountId", t.accountId, "Conta")}</div>
    <div ${show("credito")}>${CFG.cards.length?cardSelect("cardId", t.cardId):`<div class="banner">Nenhum cartão cadastrado.</div>`}</div>
    <div class="frow" ${show("credito")}><div class="field"><label for="m-inst">Parcelas</label><select id="m-inst" name="installments" data-live="1">${Array.from({length:24},(_, i)=>`<option value="${i+1}" ${+t.installments===i+1?"selected":""}>${i===0?"À vista":(i+1)+"x"}</option>`).join("")}</select></div><div class="field"><span class="flabel">Como fica</span><div id="parc-preview" class="tiny muted" style="padding-top:8px"></div></div></div>
    <div ${show("despesa,credito")}>${catSelect("despesa", t.type!=="receita"?catSel:"")}</div>
    <div ${show("receita")}>${catSelect("receita", t.type==="receita"?catSel:"")}<label class="check" style="margin-top:8px"><input type="checkbox" name="salary" ${t.salary?"checked":""}>É o meu salário do mês</label></div>
    <div class="frow" ${show("transfer")}>${accSelect("from", t.type==="transfer"?t.accountId:t.accountId, "De")}${accSelect("to", toDefault, "Para")}</div>
    <div ${show("fatura")}>${CFG.cards.length?`<div class="frow">${cardSelect("payCard", t.cardId).replace('name="payCard"','name="payCard" data-live="1"')}<div class="field"><label for="m-inv">Fatura</label><select id="m-inv" name="invoiceKey" data-cur="${invKey}"></select></div></div>${accSelect("payFrom", t.accountId, "Pagar com a conta")}`:`<div class="banner">Nenhum cartão cadastrado.</div>`}</div>
    <div class="field"><label for="m-note">Observação</label><input id="m-note" name="note" value="${esc(t.note||"")}" placeholder="Opcional"></div>`;
  openModal({title: isNew ? "Novo lançamento" : "Editar lançamento", body, del: !isNew ? () => { delTx(t); toast("Lançamento excluído"); } : null,
    onSubmit: () => {
      const v = fd(), type = v.type, amount = parseMoney(v.amount);
      if (!(amount>0)) return mErr("Informe um valor maior que zero.");
      if (!v.date) return mErr("Informe a data.");
      const n = {id:t.id||uid(), createdAt:t.createdAt||Date.now(), type, amount, date:v.date, desc:(v.desc||"").trim(), note:(v.note||"").trim()};
      if (type==="despesa"||type==="receita"){ n.accountId = v.accountId; const [c,s] = (v["cat_"+type]||"|").split("|"); n.catId = c||""; n.subId = s||""; if (type==="receita") n.salary = !!v.salary; if (t.billId) n.billId = t.billId; }
      if (type==="credito"){ if (!v.cardId) return mErr("Cadastre um cartão primeiro."); n.cardId = v.cardId; n.installments = +v.installments||1; const [c,s] = (v.cat_despesa||"|").split("|"); n.catId=c||""; n.subId=s||""; }
      if (type==="transfer"){ if (v.from===v.to) return mErr("Escolha contas diferentes para origem e destino."); n.accountId = v.from; n.toAccountId = v.to; }
      if (type==="fatura"){ if (!v.payCard) return mErr("Cadastre um cartão primeiro."); n.cardId = v.payCard; n.invoiceKey = v.invoiceKey; n.accountId = v.payFrom; }
      if (!n.desc && (type==="despesa"||type==="credito")) n.desc = catById(n.catId)?.name || "Gasto";
      if (!n.desc && type==="receita") n.desc = n.salary ? "Salário" : (catById(n.catId)?.name || "Receita");
      putTx(n, t.date && !isNew ? t.date : null);
      closeModal(); toast(isNew ? "Lançamento salvo" : "Alterações salvas"); render();
    }});
  refreshTxModal();
}
function refreshTxModal(){
  const form = document.getElementById("mform"); if (!form) return;
  const type = form.type?.value;
  const pv = document.getElementById("parc-preview");
  if (pv && type==="credito"){
    const amt = parseMoney(form.amount.value), n = +form.installments.value||1, card = cardById(form.cardId?.value);
    if (amt>0 && card && form.date.value){ const ps = parcelsOf({type:"credito", amount:amt, installments:n, date:form.date.value, cardId:card.id}); pv.innerHTML = `${n>1?`${n}x de ${fmt(ps[0].amount)}`:"À vista"} · primeira fatura: ${mLabel(ps[0].invoiceKey).toLowerCase()}`; }
    else pv.textContent = "Informe valor e data";
  }
  const inv = document.getElementById("m-inv");
  if (inv && form.payCard){
    const card = cardById(form.payCard.value); if (!card) return;
    const cur = inv.value || inv.dataset.cur; const keys = new Set();
    for (let i=-6;i<=2;i++){ const k = addM(mk(todayStr()),i); const iv = invoiceOf(card,k); if (iv.remaining>0 || k===cur) keys.add(k); }
    if (cur) keys.add(cur);
    inv.innerHTML = [...keys].sort().map(k => { const iv = invoiceOf(card,k); return `<option value="${k}" ${k===cur?"selected":""}>${mLabel(k)} · ${iv.remaining>0?"falta "+fmt(iv.remaining):"paga"}</option>`; }).join("");
    if (!inv.value && inv.options.length) inv.selectedIndex = 0;
    if (form.amount && !parseMoney(form.amount.value)){ const iv = invoiceOf(card, inv.value); if (iv.remaining>0) form.amount.value = fmtIn(iv.remaining); }
  }
}
function setTxType(type){
  const form = document.getElementById("mform"); form.type.value = type;
  form.querySelectorAll(".seg [data-t]").forEach(b => b.setAttribute("aria-pressed", b.dataset.t===type));
  form.querySelectorAll("[data-types]").forEach(el => el.hidden = !el.dataset.types.split(",").includes(type));
  refreshTxModal();
}

function bankPicker(sel){
  return `<input type="hidden" name="bank" value="${esc(sel)}"><div class="flabel">Instituição</div><div class="bank-grid" role="group" aria-label="Instituição">${Object.entries(BANKS).map(([k,b])=>`<button type="button" class="bank-opt" data-act="pick-bank" data-bank="${k}" aria-pressed="${k===sel}">${logoHTML({bank:k,name:b.name},30)}<span>${esc(b.name)}</span></button>`).join("")}</div>`;
}
function brandFields(e){
  return `<div class="field" data-otherbank ${e.bank==="outro"?"":"hidden"}><label for="m-bankName">Nome da instituição</label><input id="m-bankName" name="bankName" value="${esc(e.bankName||"")}" placeholder="Ex.: Cooperativa X" data-live="1"></div>
  <div class="frow">
    <div class="field"><label for="m-color">Cor personalizada</label><div class="row"><input id="m-color" name="color" type="color" value="${esc(e.color || (BANKS[e.bank]||BANKS.outro).bg)}" style="width:52px;padding:2px;height:36px" data-live="1"><label class="check"><input type="checkbox" name="useColor" ${e.color?"checked":""} data-live="1">Usar esta cor</label></div></div>
    <div class="field"><span class="flabel">Logo próprio (opcional)</span><div class="row"><label class="btn sm" for="m-logo-file">Enviar imagem</label><input id="m-logo-file" type="file" accept="image/*" hidden><button type="button" class="btn sm ghost" data-act="logo-clear">Remover</button></div><input type="hidden" name="logo" value="${esc(e.logo||"")}"><span class="hint">PNG ou JPG. Substitui o monograma.</span></div>
  </div>`;
}
function refreshBrandPreview(){
  const form = document.getElementById("mform"); const box = document.getElementById("brand-preview"); if (!form || !box) return;
  const ent = {bank:form.bank.value, color:form.useColor?.checked ? form.color.value : "", logo:form.logo.value, name:form.name?.value || "", bankName:form.bankName?.value};
  box.querySelector("[data-logo]").innerHTML = logoHTML(ent, 44);
  box.querySelector("[data-name]").textContent = form.name?.value || "Sem nome";
  box.querySelector("[data-bank]").textContent = bankName(ent);
  const ob = form.querySelector("[data-otherbank]"); if (ob) ob.hidden = form.bank.value!=="outro";
}
function accModal(a){
  const isNew = !a;
  a = a ? clone(a) : {bank:"nubank", name:"", type:"corrente", initial:0, initialDate:todayStr(), committed:0};
  const body = `<div class="preview-box" id="brand-preview"><span data-logo>${logoHTML(a,44)}</span><div class="grow"><div data-name style="font-weight:700">${esc(a.name||"Sem nome")}</div><div class="tiny muted" data-bank>${esc(bankName(a))}</div></div></div>
    ${bankPicker(a.bank)}
    <div class="frow"><div class="field"><label for="m-name">Nome da conta</label><input id="m-name" name="name" value="${esc(a.name)}" placeholder="Ex.: Nubank conta" data-live="1"></div>
    <div class="field"><label for="m-type">Tipo</label><select id="m-type" name="type">${Object.entries(ACC_TYPES).map(([k,l])=>`<option value="${k}" ${a.type===k?"selected":""}>${l}</option>`).join("")}</select></div></div>
    ${brandFields(a)}
    <div class="frow"><div class="field"><label for="m-initial">Saldo inicial</label><input id="m-initial" name="initial" inputmode="decimal" value="${fmtIn(a.initial)}"><span class="hint">Saldo na data ao lado</span></div>
    <div class="field"><label for="m-idate">Data do saldo inicial</label><input id="m-idate" name="initialDate" type="date" value="${a.initialDate||todayStr()}"></div></div>
    <div class="frow"><div class="field"><label for="m-committed">Valor comprometido</label><input id="m-committed" name="committed" inputmode="decimal" value="${fmtIn(a.committed||0)}"><span class="hint">Dinheiro bloqueado (ex.: garantia). Em "Garantia de limite" o saldo todo conta como comprometido.</span></div>
    <div class="field"><span class="flabel">Uso</span><label class="check"><input type="checkbox" name="saving" ${a.saving?"checked":""}>Guardo minha reserva nesta conta</label></div></div>
    <div class="field"><label for="m-anote">Observação</label><input id="m-anote" name="note" value="${esc(a.note||"")}" placeholder="Ex.: agência, finalidade"></div>`;
  const refs = isNew ? 0 : allTx().filter(t=>[t.accountId,t.toAccountId].includes(a.id)).length;
  openModal({title:isNew?"Nova conta":"Editar conta", wide:true, body,
    del: isNew ? null : () => { removeTxWhere(t=>t.accountId===a.id||t.toAccountId===a.id); CFG.accounts = CFG.accounts.filter(x=>x.id!==a.id); CFG.goals.forEach(g=>g.accountIds=(g.accountIds||[]).filter(i=>i!==a.id)); if (CFG.income.accountId===a.id) CFG.income.accountId=""; saveCfg(); toast("Conta excluída"); },
    delNote: refs ? `Isso também apaga ${refs} lançamento(s) desta conta.` : "",
    onSubmit: () => {
      const v = fd(); if (!v.name.trim()) return mErr("Dê um nome para a conta.");
      const n = {...a, id:a.id||uid(), bank:v.bank, bankName:v.bank==="outro"?v.bankName.trim():"", name:v.name.trim(), type:v.type, initial:parseMoney(v.initial), initialDate:v.initialDate||todayStr(), committed:parseMoney(v.committed), saving:!!v.saving, color:v.useColor?v.color:"", logo:v.logo||"", note:v.note.trim()};
      const i = CFG.accounts.findIndex(x=>x.id===n.id); if (i>=0) CFG.accounts[i]=n; else CFG.accounts.push(n);
      if (!CFG.income.accountId && n.type==="corrente") CFG.income.accountId = n.id;
      saveCfg(); closeModal(); toast(isNew?"Conta adicionada":"Conta atualizada"); render();
    }});
  if (refs) MODAL.delNote = `Isso também apaga ${refs} lançamento(s) desta conta.`;
}
function cardModal(c){
  const isNew = !c;
  c = c ? clone(c) : {bank:"nubank", name:"", limit:0, closeDay:1, dueDay:8, payAccountId:CFG.accounts[0]?.id};
  const body = `<div class="preview-box" id="brand-preview"><span data-logo>${logoHTML(c,44)}</span><div class="grow"><div data-name style="font-weight:700">${esc(c.name||"Sem nome")}</div><div class="tiny muted" data-bank>${esc(bankName(c))}</div></div></div>
    ${bankPicker(c.bank)}
    <div class="frow"><div class="field"><label for="m-name">Nome do cartão</label><input id="m-name" name="name" value="${esc(c.name)}" placeholder="Ex.: Roxinho" data-live="1"></div>
    <div class="field"><label for="m-limit">Limite</label><input id="m-limit" name="limit" inputmode="decimal" value="${fmtIn(c.limit)}"></div></div>
    <div class="frow"><div class="field"><label for="m-close">Dia de fechamento</label><input id="m-close" name="closeDay" type="number" min="1" max="31" value="${c.closeDay}"><span class="hint">Compras a partir deste dia vão para a fatura seguinte</span></div>
    <div class="field"><label for="m-due">Dia de vencimento</label><input id="m-due" name="dueDay" type="number" min="1" max="31" value="${c.dueDay}"></div></div>
    ${accSelect("payAccountId", c.payAccountId, "Conta que paga a fatura", {blank:"Escolher na hora"})}
    ${brandFields(c)}`;
  const refs = isNew ? 0 : allTx().filter(t=>t.cardId===c.id).length;
  openModal({title:isNew?"Novo cartão":"Editar cartão", wide:true, body,
    del: isNew ? null : () => { removeTxWhere(t=>t.cardId===c.id); CFG.cards = CFG.cards.filter(x=>x.id!==c.id); saveCfg(); toast("Cartão excluído"); },
    onSubmit: () => {
      const v = fd(); if (!v.name.trim()) return mErr("Dê um nome para o cartão.");
      const cd = +v.closeDay, dd = +v.dueDay; if (!(cd>=1&&cd<=31&&dd>=1&&dd<=31)) return mErr("Use dias entre 1 e 31.");
      const n = {...c, id:c.id||uid(), bank:v.bank, bankName:v.bank==="outro"?v.bankName.trim():"", name:v.name.trim(), limit:parseMoney(v.limit), closeDay:cd, dueDay:dd, payAccountId:v.payAccountId, color:v.useColor?v.color:"", logo:v.logo||""};
      const i = CFG.cards.findIndex(x=>x.id===n.id); if (i>=0) CFG.cards[i]=n; else CFG.cards.push(n);
      UI.cardId = n.id; saveCfg(); closeModal(); toast(isNew?"Cartão adicionado":"Cartão atualizado"); render();
    }});
  if (refs) MODAL.delNote = `Isso também apaga ${refs} compra(s) e pagamento(s) deste cartão.`;
}
function adjustModal(a, t){
  if (!a) return;
  const cur = balance(a) - (t ? t.amount : 0);
  openModal({title:"Ajustar saldo · "+a.name, body:`<p class="muted" style="margin:0">Saldo calculado: <b class="money">${fmt(cur)}</b>. Informe o saldo real que aparece no app do banco e a diferença vira um lançamento de ajuste.</p>
    <div class="frow"><div class="field"><label for="m-real">Saldo real</label><input id="m-real" name="real" inputmode="decimal" value="${fmtIn(t?cur+t.amount:cur)}"></div><div class="field"><label for="m-adate">Data</label><input id="m-adate" name="date" type="date" value="${t?.date||todayStr()}"></div></div>`,
    del: t ? () => { delTx(t); toast("Ajuste excluído"); } : null,
    onSubmit: () => { const v = fd(); const diff = r2(parseMoney(v.real) - cur); if (Math.abs(diff)<0.005 && !t){ closeModal(); return; }
      putTx({id:t?.id||uid(), createdAt:t?.createdAt||Date.now(), type:"ajuste", accountId:a.id, amount:diff, date:v.date||todayStr(), desc:"Ajuste de saldo"}, t?.date); closeModal(); toast("Saldo ajustado"); render(); }});
}
function payInvoiceModal(card, key){
  const iv = invoiceOf(card, key);
  txModal(null, {type:"fatura", cardId:card.id, accountId:card.payAccountId || CFG.accounts[0]?.id});
  const f = document.getElementById("mform"); if (!f) return;
  const inv = document.getElementById("m-inv"); if (inv){ inv.dataset.cur = key; inv.value = ""; }
  f.amount.value = "";
  refreshTxModal();
  if (iv.remaining>0) f.amount.value = fmtIn(iv.remaining);
}
function payBill(b){
  txModal(null, {type:"despesa", accountId:b.accountId||CFG.income.accountId});
  const f = document.getElementById("mform"); if (!f) return;
  f.amount.value = fmtIn(b.amount); f.desc.value = b.name; f.date.value = dateIn(UI.month, b.day) > todayStr() && UI.month===mk(todayStr()) ? todayStr() : dateIn(UI.month, b.day);
  if (b.catId) f.cat_despesa.value = b.catId+"|";
  const orig = MODAL.onSubmit;
  MODAL.onSubmit = () => { const before = new Set(allTx().map(t=>t.id)); orig(); const n = allTx().find(t=>!before.has(t.id)); if (n){ n.billId = b.id; saveMonth(mk(n.date)); } };
}
function salaryModal(){
  const key = UI.month;
  openModal({title:"Registrar salário", body:`<div class="frow"><div class="field"><label for="m-samt">Valor recebido</label><input id="m-samt" name="amount" inputmode="decimal" value="${fmtIn(CFG.income.amount)}"></div><div class="field"><label for="m-sdate">Data</label><input id="m-sdate" name="date" type="date" value="${key===mk(todayStr())?todayStr():dateIn(key,CFG.income.day)}"></div></div>${accSelect("accountId", CFG.income.accountId, "Caiu na conta")}`,
    submitLabel:"Registrar e separar", onSubmit: () => { const v = fd(), amount = parseMoney(v.amount); if (!(amount>0)) return mErr("Informe o valor recebido.");
      const sc = CFG.categories.find(c=>c.kind==="receita" && c.name==="Salário");
      putTx({id:uid(), createdAt:Date.now(), type:"receita", salary:true, amount, date:v.date, accountId:v.accountId, desc:"Salário", catId:sc?.id||"", subId:""});
      closeModal(); render(); splitModal(v.accountId); }});
}
function splitModal(fromId){
  const key = UI.month, P = monthPlan(key), falta = Math.max(0, r2(P.meta - P.saved));
  const goal = CFG.goals[0], dest = (goal?.accountIds||[])[0] || CFG.accounts.find(a=>isSaving(a) && a.type!=="garantia")?.id;
  const invs = CFG.cards.map(c=>invoiceOf(c,key)).filter(i=>i.remaining>0);
  const bills = CFG.bills.filter(b=>b.active!==false && !billPaid(b,key));
  const from = fromId || CFG.income.accountId;
  openModal({title:"Separar o salário", wide:true, body:`
    <p class="muted" style="margin:0">Sugestão para ${mLabel(key).toLowerCase()}: tire primeiro a parte da economia e deixe as contas reservadas. O que sobra é o que você pode gastar.</p>
    <div class="list">
      <div class="li"><span class="swatch" style="background:var(--seg-save)"></span><span class="grow"><b>Guardar</b> · meta do mês</span><span class="amt">${fmt(falta)}</span></div>
      ${invs.map(i=>`<div class="li"><span class="swatch" style="background:var(--seg-bills)"></span><span class="grow">Fatura ${esc(i.card.name)} · vence ${dBR(i.dueDate)}</span><span class="amt">${fmt(i.remaining)}</span></div>`).join("")}
      ${bills.map(b=>`<div class="li"><span class="swatch" style="background:var(--seg-bills)"></span><span class="grow">${esc(b.name)} · dia ${b.day}</span><span class="amt">${fmt(b.amount)}</span></div>`).join("")}
      <div class="li"><span class="swatch" style="background:var(--seg-free)"></span><span class="grow"><b>Livre para gastar no mês</b></span><span class="amt ${P.livre<0?"neg":"pos"}">${fmt(P.livre)}</span></div>
    </div>
    ${falta>0?`<div class="divider"></div><div class="flabel">Transferir a economia agora</div>
    <div class="frow">${accSelect("from", from, "De")}${accSelect("to", dest, "Para (reserva)")}</div>
    <div class="field"><label for="m-splamt">Valor</label><input id="m-splamt" name="amount" inputmode="decimal" value="${fmtIn(falta)}"></div>
    ${dest?"":`<div class="banner">Marque uma conta como "Guardo minha reserva nesta conta" para ela aparecer como destino padrão.</div>`}`:`<div class="banner info">A meta de economia deste mês já está cumprida.</div>`}`,
    submitLabel: falta>0 ? "Transferir para a reserva" : "Fechar",
    onSubmit: () => { if (falta<=0){ closeModal(); return; } const v = fd(), amount = parseMoney(v.amount); if (!(amount>0)) return mErr("Informe o valor.");
      if (v.from===v.to) return mErr("Escolha contas diferentes.");
      const d = key===mk(todayStr()) ? todayStr() : dateIn(key, CFG.income.day);
      putTx({id:uid(), createdAt:Date.now(), type:"transfer", amount, date:d, accountId:v.from, toAccountId:v.to, desc:"Reserva do mês"}); closeModal(); toast("Economia separada"); render(); }});
}
function budgetModal(c){
  const key = UI.month, cur = budgetOf(c,key);
  openModal({title:"Limite · "+c.name, body:`<div class="field"><label for="m-bud">Limite mensal</label><input id="m-bud" name="v" inputmode="decimal" value="${fmtIn(cur)}"></div>
    <div class="seg" role="radiogroup" aria-label="Aplicar"><label class="check" style="padding:6px 10px"><input type="radio" name="scope" value="all" checked>Todos os meses (padrão)</label><label class="check" style="padding:6px 10px"><input type="radio" name="scope" value="month">Só em ${mLabel(key).toLowerCase()}</label></div>
    ${CFG.budgetOverrides?.[key]?.[c.id]!=null?`<button type="button" class="btn sm" data-act="clear-override" data-id="${c.id}">Voltar ao padrão (${fmt(c.budget)}) neste mês</button>`:""}`,
    onSubmit: () => { const v = fd(), val = parseMoney(v.v);
      if (v.scope==="month"){ (CFG.budgetOverrides[key] ||= {})[c.id] = val; }
      else { c.budget = val; if (CFG.budgetOverrides[key]) delete CFG.budgetOverrides[key][c.id]; }
      saveCfg(); closeModal(); toast("Limite atualizado"); render(); }});
}
function catModal(c){
  const isNew = !c; c = c ? clone(c) : {name:"", color:"#5A6FD8", budget:0, kind:"despesa", subs:[]};
  const used = isNew ? 0 : allTx().filter(t=>t.catId===c.id).length;
  openModal({title:isNew?"Nova categoria":"Editar categoria", body:`
    <div class="frow"><div class="field"><label for="m-cname">Nome</label><input id="m-cname" name="name" value="${esc(c.name)}"></div>
    <div class="field"><label for="m-ckind">Tipo</label><select id="m-ckind" name="kind"><option value="despesa" ${c.kind==="despesa"?"selected":""}>Despesa</option><option value="receita" ${c.kind==="receita"?"selected":""}>Receita</option></select></div></div>
    <div class="frow"><div class="field"><label for="m-ccolor">Cor</label><input id="m-ccolor" name="color" type="color" value="${esc(c.color)}" style="height:36px;padding:2px"></div>
    <div class="field"><label for="m-cbud">Limite mensal (despesas)</label><input id="m-cbud" name="budget" inputmode="decimal" value="${fmtIn(c.budget)}"></div></div>
    <div class="field"><label for="m-csubs">Subcategorias</label><textarea id="m-csubs" name="subs" rows="4" placeholder="Uma por linha">${esc(c.subs.map(s=>s.name).join("\n"))}</textarea><span class="hint">Uma por linha. Renomear mantém os lançamentos; apagar uma linha deixa os lançamentos dela sem subcategoria.</span></div>`,
    del: isNew ? null : () => { CFG.categories = CFG.categories.filter(x=>x.id!==c.id); for (const k in MONTHS){ let ch=false; MONTHS[k].forEach(t=>{ if (t.catId===c.id){ t.catId=""; t.subId=""; ch=true; } }); if (ch) saveMonth(k); } saveCfg(); toast("Categoria excluída"); },
    onSubmit: () => { const v = fd(); if (!v.name.trim()) return mErr("Dê um nome para a categoria.");
      const lines = v.subs.split("\n").map(s=>s.trim()).filter(Boolean);
      const subs = lines.map((name,i) => { const ex = c.subs.find(s=>s.name===name) || (c.subs[i] && !lines.includes(c.subs[i].name) ? c.subs[i] : null); return {id:ex?.id||uid(), name}; });
      const n = {...c, id:c.id||uid(), name:v.name.trim(), kind:v.kind, color:v.color, budget:parseMoney(v.budget), subs};
      const i = CFG.categories.findIndex(x=>x.id===n.id); if (i>=0) CFG.categories[i]=n; else CFG.categories.push(n);
      saveCfg(); closeModal(); toast("Categoria salva"); render(); }});
  if (used) MODAL.delNote = `${used} lançamento(s) ficarão sem categoria.`;
}
function goalModal(g){
  const isNew = !g; g = g ? clone(g) : {name:"", target:0, accountIds:[], manual:0, deadline:""};
  openModal({title:isNew?"Nova meta":"Editar meta", body:`
    <div class="frow"><div class="field"><label for="m-gname">Nome</label><input id="m-gname" name="name" value="${esc(g.name)}" placeholder="Ex.: Reserva de emergência"></div>
    <div class="field"><label for="m-gtarget">Valor da meta</label><input id="m-gtarget" name="target" inputmode="decimal" value="${fmtIn(g.target)}"></div></div>
    <div class="frow"><div class="field"><label for="m-gdl">Prazo (opcional)</label><input id="m-gdl" name="deadline" type="date" value="${esc(g.deadline||"")}"></div>
    <div class="field"><label for="m-gman">Valor guardado fora das contas</label><input id="m-gman" name="manual" inputmode="decimal" value="${fmtIn(g.manual||0)}"></div></div>
    <div class="field"><span class="flabel">Contas que formam a meta</span>${CFG.accounts.map(a=>`<label class="check"><input type="checkbox" name="acc_${a.id}" ${(g.accountIds||[]).includes(a.id)?"checked":""}>${esc(a.name)} · ${fmt(balance(a)-committedOf(a,balance(a)))} livre</label>`).join("") || `<span class="hint">Cadastre contas primeiro.</span>`}<span class="hint">O progresso soma o saldo livre dessas contas. Valores comprometidos não contam.</span></div>`,
    del: isNew ? null : () => { CFG.goals = CFG.goals.filter(x=>x.id!==g.id); saveCfg(); toast("Meta excluída"); },
    onSubmit: () => { const v = fd(); if (!v.name.trim()) return mErr("Dê um nome para a meta.");
      const n = {...g, id:g.id||uid(), name:v.name.trim(), target:parseMoney(v.target), manual:parseMoney(v.manual), deadline:v.deadline||"", accountIds:CFG.accounts.filter(a=>v["acc_"+a.id]).map(a=>a.id)};
      const i = CFG.goals.findIndex(x=>x.id===n.id); if (i>=0) CFG.goals[i]=n; else CFG.goals.push(n);
      saveCfg(); closeModal(); toast("Meta salva"); render(); }});
}
function billModal(b){
  const isNew = !b; b = b ? clone(b) : {name:"", amount:0, day:10, catId:"", accountId:CFG.income.accountId, active:true};
  openModal({title:isNew?"Nova conta fixa":"Editar conta fixa", body:`
    <div class="frow"><div class="field"><label for="m-bname">Nome</label><input id="m-bname" name="name" value="${esc(b.name)}" placeholder="Ex.: Celular"></div>
    <div class="field"><label for="m-bamt">Valor</label><input id="m-bamt" name="amount" inputmode="decimal" value="${fmtIn(b.amount)}"></div></div>
    <div class="frow"><div class="field"><label for="m-bday">Dia do vencimento</label><input id="m-bday" name="day" type="number" min="1" max="31" value="${b.day}"></div>
    <div class="field"><label for="m-bcat">Categoria</label><select id="m-bcat" name="catId"><option value="">—</option>${CFG.categories.filter(c=>c.kind==="despesa").map(c=>`<option value="${c.id}" ${c.id===b.catId?"selected":""}>${esc(c.name)}</option>`).join("")}</select></div></div>
    ${accSelect("accountId", b.accountId, "Paga com a conta")}
    <label class="check"><input type="checkbox" name="active" ${b.active!==false?"checked":""}>Ativa</label>`,
    del: isNew ? null : () => { CFG.bills = CFG.bills.filter(x=>x.id!==b.id); saveCfg(); toast("Conta fixa excluída"); },
    onSubmit: () => { const v = fd(); if (!v.name.trim()) return mErr("Dê um nome.");
      const n = {...b, id:b.id||uid(), name:v.name.trim(), amount:parseMoney(v.amount), day:Math.max(1,Math.min(31,+v.day||1)), catId:v.catId, accountId:v.accountId, active:!!v.active};
      const i = CFG.bills.findIndex(x=>x.id===n.id); if (i>=0) CFG.bills[i]=n; else CFG.bills.push(n);
      saveCfg(); closeModal(); toast("Conta fixa salva"); render(); }});
}

/* ============ logo upload ============ */
function handleLogoFile(file){
  if (!file || !file.type.startsWith("image/")) return;
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {
    const S = 96, cv = document.createElement("canvas"); cv.width = S; cv.height = S; const ctx = cv.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0,0,S,S);
    const sc = Math.min(S/img.width, S/img.height); const w = img.width*sc, h = img.height*sc;
    ctx.drawImage(img, (S-w)/2, (S-h)/2, w, h); URL.revokeObjectURL(url);
    const form = document.getElementById("mform"); if (form?.logo){ form.logo.value = cv.toDataURL("image/png"); refreshBrandPreview(); }
  };
  img.onerror = () => toast("Não consegui ler essa imagem.");
  img.src = url;
}

/* ============ backup ============ */
async function exportBackup(){
  const data = JSON.stringify({app:"caixa-pessoal", exportedAt:new Date().toISOString(), cfg:CFG, months:MONTHS}, null, 2);
  const name = "caixa-pessoal-"+todayStr()+".json";
  try {
    const dl = window.claude?.use ? await window.claude.use("downloads") : null;
    if (dl){ await dl.save({filename:name, data}); toast("Backup salvo"); return; }
  } catch(e){ if (e?.code==="declined"){ return; } }
  if (!window.claude){ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data],{type:"application/json"})); a.download = name; a.click(); return; }
  const out = document.getElementById("backup-out");
  if (out){ out.innerHTML = `<div class="field"><label for="bk-text">Copie e guarde este texto</label><textarea id="bk-text" rows="6" readonly>${esc(data)}</textarea></div>`; document.getElementById("bk-text").select(); }
}
function importBackup(file){
  const r = new FileReader();
  r.onload = () => {
    let d; try { d = JSON.parse(r.result); } catch(e){ toast("Arquivo inválido."); return; }
    if (!d?.cfg){ toast("Esse arquivo não é um backup do Caixa Pessoal."); return; }
    openModal({title:"Restaurar backup", body:`<p style="margin:0">Isso substitui todos os dados atuais pelos do backup de ${esc((d.exportedAt||"").slice(0,10))}.</p>`, submitLabel:"Substituir dados",
      onSubmit: () => { const oldKeys = Object.keys(MONTHS); CFG = normalizeCfg(d.cfg); MONTHS = d.months||{}; saveCfg(); new Set([...oldKeys, ...Object.keys(MONTHS)]).forEach(saveMonth); closeModal(); toast("Backup restaurado"); render(); }});
  };
  r.readAsText(file);
}

/* ============ tema, rota, toast ============ */
function currentTheme(){ const t = document.documentElement.getAttribute("data-theme"); return t==="light"||t==="dark" ? t : "auto"; }
function readTheme(){ try { const t = localStorage.getItem("caixa-theme"); if (t==="light"||t==="dark") document.documentElement.setAttribute("data-theme", t); } catch(e){} }
function setTheme(m){ if (m==="auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", m); try { localStorage.setItem("caixa-theme", m); } catch(e){} render(); }
function readHash(){ const h = (location.hash||"").slice(1); if (VIEWS[h]) UI.view = h; }
let toastT; function toast(msg){ const r = document.getElementById("toast-root"); r.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toastT); toastT = setTimeout(()=>r.innerHTML="", 2400); }

/* ============ eventos ============ */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (a==="scrim" && e.target!==el) return;
  switch(a){
    case "nav": UI.view = el.dataset.v; try { history.replaceState(null,"","#"+UI.view); } catch(_){ location.hash = UI.view; } render(); window.scrollTo(0,0); break;
    case "month": UI.month = addM(UI.month, +el.dataset.d); render(); break;
    case "month-today": UI.month = mk(todayStr()); render(); break;
    case "theme": setTheme(el.dataset.m); break;
    case "scrim": case "close": closeModal(); break;
    case "new-tx": txModal(null, {type:el.dataset.type, cardId:el.dataset.card}); break;
    case "edit-tx": { const t = findTx(id); if (t) txModal(t); break; }
    case "tx-type": setTxType(el.dataset.t); break;
    case "transfer": txModal(null, {type:"transfer", from:el.dataset.from, toAccountId:el.dataset.to}); break;
    case "new-acc": accModal(); break;
    case "edit-acc": accModal(accById(id)); break;
    case "adjust": adjustModal(accById(id)); break;
    case "new-card": cardModal(); break;
    case "edit-card": cardModal(cardById(id)); break;
    case "open-card": UI.cardId = id; UI.view = "cartoes"; render(); break;
    case "sel-card": UI.cardId = id; render(); break;
    case "pay-invoice": payInvoiceModal(cardById(id), el.dataset.k); break;
    case "pay-bill": payBill(CFG.bills.find(b=>b.id===id)); break;
    case "salary": salaryModal(); break;
    case "split": splitModal(salaryTx(UI.month)[0]?.accountId); break;
    case "edit-budget": budgetModal(catById(id)); break;
    case "clear-override": if (CFG.budgetOverrides[UI.month]) delete CFG.budgetOverrides[UI.month][id]; saveCfg(); closeModal(); render(); break;
    case "new-cat": catModal(); break;
    case "edit-cat": catModal(catById(id)); break;
    case "new-goal": goalModal(); break;
    case "edit-goal": goalModal(CFG.goals.find(g=>g.id===id)); break;
    case "new-bill": billModal(); break;
    case "edit-bill": billModal(CFG.bills.find(b=>b.id===id)); break;
    case "export": exportBackup(); break;
    case "pick-bank": { const f = document.getElementById("mform"); f.bank.value = el.dataset.bank; f.querySelectorAll(".bank-opt").forEach(b=>b.setAttribute("aria-pressed", b===el)); if (!f.useColor?.checked && f.color) f.color.value = (BANKS[el.dataset.bank]||BANKS.outro).bg; refreshBrandPreview(); break; }
    case "logo-clear": { const f = document.getElementById("mform"); f.logo.value = ""; refreshBrandPreview(); break; }
    case "m-del":
      if (el.dataset.armed!=="1"){ el.dataset.armed = "1"; el.textContent = "Confirmar exclusão"; if (MODAL?.delNote) mErr(MODAL.delNote); return; }
      MODAL?.del?.(); closeModal(); render(); break;
  }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target;
  if (f.id==="mform"){ MODAL?.onSubmit?.(); return; }
  const v = Object.fromEntries(new FormData(f).entries());
  if (f.dataset.form==="income"){ CFG.income = {amount:parseMoney(v.amount), day:Math.max(1,Math.min(31,+v.day||1)), accountId:v.accountId}; CFG.savingsTarget = parseMoney(v.savingsTarget); saveCfg(); toast("Renda e meta salvas"); render(); }
  if (f.dataset.form==="onboard"){ CFG = defaultConfig(parseMoney(v.amount), Math.max(1,Math.min(31,+v.day||5))); saveCfg(); render(); toast("Painel criado. Agora adicione suas contas."); }
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset?.filt){ UI.filt[el.dataset.filt] = el.value; const pos = el.selectionStart; render(); const n = document.querySelector(`[data-filt="${el.dataset.filt}"]`); if (n){ n.focus(); if (n.setSelectionRange && pos!=null) try{ n.setSelectionRange(pos,pos); }catch(_){} } return; }
  if (el.closest("#mform")){ if (document.getElementById("brand-preview")) refreshBrandPreview(); if (el.dataset.live) refreshTxModal(); }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id==="m-logo-file") handleLogoFile(el.files[0]);
  else if (el.id==="import-file" && el.files[0]) importBackup(el.files[0]);
  else if (el.closest("#mform")){ if (el.name==="payCard"){ const inv = document.getElementById("m-inv"); if (inv){ inv.dataset.cur=""; inv.innerHTML=""; } const f = document.getElementById("mform"); f.amount.value=""; } refreshTxModal(); if (document.getElementById("brand-preview")) refreshBrandPreview(); }
});
document.addEventListener("keydown", e => { if (e.key==="Escape" && MODAL) closeModal(); });
window.addEventListener("hashchange", () => { readHash(); render(); });

boot();
</script>
